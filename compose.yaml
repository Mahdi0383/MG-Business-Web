services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.docker}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env.docker}
    volumes:
      - mg-business-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: PostgreSql
      Database__ApplyMigrations: "true"
      ConnectionStrings__Business: Host=database;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      DataProtection__KeysDirectory: /var/lib/mg-business/keys
      Cors__AllowedOrigins__0: ${MG_FRONTEND_ORIGIN:?Set MG_FRONTEND_ORIGIN in .env.docker}
      ForwardedHeaders__KnownProxies__0: ${MG_TRUSTED_PROXY_IP:?Set MG_TRUSTED_PROXY_IP to the reverse proxy address seen by the API container}
    ports:
      - "${MG_API_BIND_ADDRESS:-127.0.0.1}:${MG_API_PORT:-8080}:8080"
    volumes:
      - mg-business-dataprotection:/var/lib/mg-business/keys

volumes:
  mg-business-postgres:
  mg-business-dataprotection:
