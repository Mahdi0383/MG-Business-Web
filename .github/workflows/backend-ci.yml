name: MG Business API - CI

on:
  push:
    branches: [main, 'feature/**']
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mg_business_ci
          POSTGRES_USER: mg_ci
          POSTGRES_PASSWORD: mg_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mg_ci -d mg_business_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/src/MG.Business.Api/MG.Business.Api.csproj
      - name: Build API
        run: dotnet build backend/src/MG.Business.Api/MG.Business.Api.csproj --configuration Release --no-restore
      - name: Restore EF tools
        run: dotnet tool restore
      - name: Verify migration snapshot matches the current model
        run: dotnet ef migrations has-pending-model-changes --project backend/src/MG.Business.Infrastructure/MG.Business.Infrastructure.csproj --startup-project backend/src/MG.Business.Api/MG.Business.Api.csproj --context BusinessDbContext --configuration Release
      - name: Verify PostgreSQL migration script can be generated
        run: dotnet ef migrations script --idempotent --project backend/src/MG.Business.Infrastructure/MG.Business.Infrastructure.csproj --startup-project backend/src/MG.Business.Api/MG.Business.Api.csproj --context BusinessDbContext --configuration Release --output ${{ runner.temp }}/mg-business-postgres.sql
      - name: Apply PostgreSQL migrations to an ephemeral database
        env:
          MG_DESIGN_CONNECTION: Host=localhost;Port=5432;Database=mg_business_ci;Username=mg_ci;Password=mg_ci_password
        run: dotnet ef database update --project backend/src/MG.Business.Infrastructure/MG.Business.Infrastructure.csproj --startup-project backend/src/MG.Business.Api/MG.Business.Api.csproj --context BusinessDbContext --configuration Release
      - name: Restore tests
        run: dotnet restore backend/tests/MG.Business.Domain.Tests/MG.Business.Domain.Tests.csproj
      - name: Run domain tests
        run: dotnet test backend/tests/MG.Business.Domain.Tests/MG.Business.Domain.Tests.csproj --configuration Release --no-restore
