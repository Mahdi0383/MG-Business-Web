name: MG Business API - CI

on:
  push:
    branches: [main, 'feature/**']
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  pull_request:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore backend/src/MG.Business.Api/MG.Business.Api.csproj
      - name: Build API
        run: dotnet build backend/src/MG.Business.Api/MG.Business.Api.csproj --configuration Release --no-restore
      - name: Restore tests
        run: dotnet restore backend/tests/MG.Business.Domain.Tests/MG.Business.Domain.Tests.csproj
      - name: Run domain tests
        run: dotnet test backend/tests/MG.Business.Domain.Tests/MG.Business.Domain.Tests.csproj --configuration Release --no-restore
