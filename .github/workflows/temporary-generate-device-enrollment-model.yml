name: Temporary EF model snapshot reconciliation

on:
  push:
    branches:
      - feature/offline-first-ha-architecture

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: |
          dotnet restore backend/src/MG.Business.Api/MG.Business.Api.csproj
          dotnet tool restore
      - name: Generate authoritative EF migration and snapshot
        run: |
          dotnet ef migrations add ReconcileDeviceEnrollmentModel --project backend/src/MG.Business.Infrastructure/MG.Business.Infrastructure.csproj --startup-project backend/src/MG.Business.Api/MG.Business.Api.csproj --context BusinessDbContext --configuration Release
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/MG.Business.Infrastructure/Persistence/Migrations
          if git diff --cached --quiet; then
            echo "EF generated no model changes."
            exit 1
          fi
          git commit -m "fix(db): reconcile device enrollment EF model snapshot [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
