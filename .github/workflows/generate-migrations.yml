name: Generate PostgreSQL EF migrations

on:
  push:
    branches:
      - feature/platform-core-foundation

permissions:
  contents: write

jobs:
  scaffold:
    if: contains(github.event.head_commit.message, '[scaffold-migrations]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Restore backend projects
        run: dotnet restore backend/src/MG.Business.Api/MG.Business.Api.csproj
      - name: Generate initial migration
        env:
          MG_DESIGN_CONNECTION: Host=localhost;Database=mg_business_design;Username=mg_design;Password=design-only
        run: >
          dotnet ef migrations add "PlatformUpdate_${GITHUB_RUN_NUMBER}"
          --project backend/src/MG.Business.Infrastructure/MG.Business.Infrastructure.csproj
          --startup-project backend/src/MG.Business.Api/MG.Business.Api.csproj
          --context BusinessDbContext
          --output-dir Persistence/Migrations
          --configuration Release
      - name: Upload generated migration and model snapshot
        uses: actions/upload-artifact@v4
        with:
          name: initial-postgres-migrations
          path: backend/src/MG.Business.Infrastructure/Persistence/Migrations/
          if-no-files-found: error
      - name: Commit generated migration sources to this feature branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const directory = 'backend/src/MG.Business.Infrastructure/Persistence/Migrations';
            const branch = context.ref.replace('refs/heads/', '');
            for (const name of fs.readdirSync(directory).filter(name => name.endsWith('.cs')).sort()) {
              const fullPath = path.join(directory, name);
              const content = fs.readFileSync(fullPath).toString('base64');
              const filePath = `${directory}/${name}`;
              let sha;
              try {
                const existing = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: filePath,
                  ref: branch
                });
                if (!Array.isArray(existing.data)) sha = existing.data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: filePath,
                message: `Commit generated EF migration source: ${name}`,
                content,
                sha,
                branch
              });
            }
