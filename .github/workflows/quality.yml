name: Project quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check core.js
          node --check public-order.js
          node --check service-worker.js
      - name: Compile Python sources
        run: python -m py_compile server.py license_tool.py backup_manager.py tests/test_server.py tests/test_backup_manager.py tests/check_project.py
      - name: Check repository structure and DOM references
        run: python tests/check_project.py
      - name: Run domain unit tests
        run: node --test tests/core.test.js
      - name: Run backend integration tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
