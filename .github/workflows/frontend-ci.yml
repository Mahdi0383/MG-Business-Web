name: MG Business Web - CI

on:
  push:
    branches: [main, 'feature/**']
    paths: ['src/**', 'package.json', 'index.html', 'vite.config.*', '.github/workflows/frontend-ci.yml']
  pull_request:
    branches: [main, 'feature/**']
    paths: ['src/**', 'package.json', 'index.html', 'vite.config.*', '.github/workflows/frontend-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build
